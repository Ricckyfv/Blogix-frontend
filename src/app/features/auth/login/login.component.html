<div class="flex items-center justify-center p-4 md:p-8 w-full max-w-container-max mx-auto py-12 min-h-[calc(100vh-16rem)]">
  <div class="glass-panel w-full max-w-[440px] rounded-xl p-8 relative overflow-hidden bg-slate-900/60 border border-slate-800/80 shadow-2xl text-slate-200">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>

    <div class="text-center mb-8">
      <h1 class="font-display-xl text-4xl text-primary font-extrabold tracking-tighter mb-2 animate-pulse">Blogix</h1>
      <p class="font-body-md text-sm text-slate-400">Welcome back. Enter your credentials to log in.</p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage) {
      <div class="mb-4 p-4 bg-error/10 border border-error/30 text-error rounded-lg text-sm font-semibold flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Social Login Buttons -->
    <div class="space-y-3 mb-6 flex justify-center w-full">
      <div id="google-btn-container" class="w-full flex justify-center min-h-[44px]"></div>
    </div>

    <div class="relative flex items-center py-4 mb-6">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink-0 mx-4 text-slate-400 font-semibold text-[10px] uppercase tracking-widest">Or log in with email</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="relative input-animated pt-5">
        <input class="peer w-full placeholder-transparent text-sm text-slate-200"
               id="email"
               placeholder=" "
               type="email"
               formControlName="email"/>
        <label class="absolute left-0 top-7 text-slate-400 text-sm pointer-events-none" for="email">Email Address</label>
      </div>

      <div class="relative input-animated pt-5">
        <input class="peer w-full placeholder-transparent text-sm text-slate-200"
               id="password"
               placeholder=" "
               type="password"
               formControlName="password"/>
        <label class="absolute left-0 top-7 text-slate-400 text-sm pointer-events-none" for="password">Password</label>
      </div>

      <div class="flex items-center justify-between mt-2">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input class="form-checkbox h-4 w-4 text-primary border-slate-850 rounded focus:ring-primary focus:ring-offset-0 bg-transparent cursor-pointer" type="checkbox"/>
          <span class="text-xs font-semibold text-slate-400">Remember me</span>
        </label>
        <a class="text-xs font-semibold text-primary hover:text-secondary transition-colors" routerLink="/forgot-password">Forgot password?</a>
      </div>

      <button class="w-full btn-gradient text-white font-bold text-sm py-3 rounded-lg shadow-md mt-6 cursor-pointer hover:scale-[1.01] active:scale-[0.99] transition-all disabled:opacity-50 disabled:pointer-events-none border-none"
              type="submit"
              [disabled]="isLoading || loginForm.invalid">
        @if (isLoading) {
          <span class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent inline-block mr-2"></span>
          Logging in...
        } @else {
          Log In
        }
      </button>
    </form>

    <!-- Demo Credentials Helper -->
    <div class="mt-6 rounded-lg border border-slate-800 bg-slate-950/40 p-4">
      <h4 class="text-xs font-bold uppercase tracking-wider text-primary mb-1">Demo Credentials</h4>
      <div class="space-y-1 text-xs text-slate-400">
        <p class="flex justify-between">
          <span>Username:</span>
          <code class="text-slate-200 select-all font-semibold">user&#64;test.com</code>
        </p>
        <p class="flex justify-between">
          <span>Password:</span>
          <code class="text-slate-200 select-all font-semibold">password</code>
        </p>
      </div>
    </div>

    <p class="mt-8 text-center font-semibold text-xs text-slate-400">
      Don't have an account?
      <a class="text-primary hover:underline font-bold" routerLink="/register">Register now</a>
    </p>
  </div>
</div>
