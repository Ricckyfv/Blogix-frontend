<div class="flex items-center justify-center p-4 md:p-8 w-full max-w-container-max mx-auto py-12 min-h-[calc(100vh-16rem)]">
  <div class="glass-panel w-full max-w-[440px] rounded-xl p-8 relative overflow-hidden bg-slate-900/60 border border-slate-800/80 shadow-2xl text-slate-200">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>

    <div class="text-center mb-8">
      <h1 class="font-display-xl text-3xl text-primary font-extrabold tracking-tighter mb-2">Recover Password</h1>
      <p class="font-body-md text-xs text-slate-400">Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    <!-- Success Alert -->
    @if (successMessage) {
      <div class="mb-6 p-4 bg-success/10 border border-success/30 text-success rounded-lg text-xs font-semibold leading-relaxed flex items-start gap-2">
        <span class="material-symbols-outlined text-[18px] mt-0.5">check_circle</span>
        <span>{{ successMessage }}</span>
      </div>
      
      <div class="text-center mt-6">
        <a class="text-xs font-bold text-primary hover:underline" routerLink="/login">Back to Login</a>
      </div>
    } @else {
      <!-- Error Alert -->
      @if (errorMessage) {
        <div class="mb-4 p-4 bg-error/10 border border-error/30 text-error rounded-lg text-xs font-semibold flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">error</span>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <!-- Recovery Form -->
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="relative input-animated pt-5">
          <input class="peer w-full placeholder-transparent text-sm text-slate-200"
                 id="email"
                 placeholder=" "
                 type="email"
                 formControlName="email"/>
          <label class="absolute left-0 top-7 text-slate-400 text-sm pointer-events-none" for="email">Email Address</label>
        </div>

        <button class="w-full btn-gradient text-white font-bold text-sm py-3 rounded-lg shadow-md mt-6 cursor-pointer hover:scale-[1.01] active:scale-[0.99] transition-all disabled:opacity-50 disabled:pointer-events-none border-none"
                type="submit"
                [disabled]="isLoading || forgotForm.invalid">
          @if (isLoading) {
            <span class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent inline-block mr-2"></span>
            Sending recovery link...
          } @else {
            Send Password Reset Link
          }
        </button>
      </form>

      <p class="mt-8 text-center font-semibold text-xs text-slate-400">
        Remembered your password?
        <a class="text-primary hover:underline font-bold" routerLink="/login">Back to Login</a>
      </p>
    }
  </div>
</div>
